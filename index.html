<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusTrade | Professional Stock Trading Terminal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            buy: '#10B981',
                            sell: '#EF4444',
                            darkBg: '#0F172A',
                            panelBg: '#1E293B',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- HEADER / NAVBAR -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-[1920px] mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-2">
                    <div class="bg-indigo-600 text-white p-1.5 rounded-lg font-bold flex items-center justify-center">
                        <i data-lucide="candlestick-chart" class="w-5 h-5"></i>
                    </div>
                    <span class="text-xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400">NEXUSTRADE</span>
                </div>
                
                <!-- Stock Switcher Dropdown -->
                <div class="relative">
                    <select id="stockSelector" onchange="changeStock(this.value)" class="bg-slate-900 border border-slate-700 text-white font-bold text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500 cursor-pointer">
                        <option value="BBCA">BBCA - Bank Central Asia</option>
                        <option value="BBRI">BBRI - Bank Rakyat Indonesia</option>
                        <option value="TLKM">TLKM - Telkom Indonesia</option>
                        <option value="GOTO">GOTO - GoTo Gojek Tokopedia</option>
                        <option value="ASII">ASII - Astra International</option>
                    </select>
                </div>

                <!-- Price Ticker Top Header -->
                <div class="hidden lg:flex items-center space-x-6 border-l border-slate-700 pl-6 text-xs">
                    <div>
                        <div class="text-slate-400">Harga Terakhir</div>
                        <div id="topLastPrice" class="text-base font-bold text-emerald-400">Rp 10,125</div>
                    </div>
                    <div>
                        <div class="text-slate-400">Perubahan</div>
                        <div id="topChange" class="font-semibold text-emerald-400">+1.25% (+125)</div>
                    </div>
                    <div>
                        <div class="text-slate-400">Tertinggi (High)</div>
                        <div id="topHigh" class="font-medium text-slate-200">Rp 10,250</div>
                    </div>
                    <div>
                        <div class="text-slate-400">Terendah (Low)</div>
                        <div id="topLow" class="font-medium text-slate-200">Rp 10,000</div>
                    </div>
                    <div>
                        <div class="text-slate-400">Volume Total</div>
                        <div id="topVolume" class="font-medium text-slate-200">1,245,300 Lot</div>
                    </div>
                </div>
            </div>

            <!-- Top Right Bar -->
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <div class="text-xs text-slate-400">Saldo Cash</div>
                    <div id="cashBalanceDisplay" class="text-sm font-bold text-emerald-400">Rp 100,000,000</div>
                </div>
                <button onclick="resetBalance()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-1.5 rounded transition flex items-center gap-1">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="flex-1 max-w-[1920px] w-full mx-auto p-2 lg:p-4 grid grid-cols-1 lg:grid-cols-12 gap-3">
        
        <!-- LEFT COLUMN: WATCHLIST & RUNNING TRADE (3 COLS) -->
        <div class="lg:col-span-3 flex flex-col space-y-3">
            
            <!-- Watchlist Panel -->
            <div class="bg-slate-800 rounded-xl border border-slate-700/80 p-3 flex-1 flex flex-col">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="list font-semibold" class="w-4 h-4 text-indigo-400"></i> Watchlist Pasar
                    </h2>
                    <span class="text-[10px] bg-indigo-500/20 text-indigo-300 font-semibold px-2 py-0.5 rounded">Live</span>
                </div>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-xs text-left">
                        <thead class="text-[11px] text-slate-400 border-b border-slate-700">
                            <tr>
                                <th class="pb-2 font-medium">Emiten</th>
                                <th class="pb-2 text-right font-medium">Harga</th>
                                <th class="pb-2 text-right font-medium">Chg %</th>
                            </tr>
                        </thead>
                        <tbody id="watchlistBody" class="divide-y divide-slate-700/50">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Running Trade Panel -->
            <div class="bg-slate-800 rounded-xl border border-slate-700/80 p-3 h-64 flex flex-col">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="activity" class="w-4 h-4 text-indigo-400"></i> Running Trade
                    </h2>
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-
